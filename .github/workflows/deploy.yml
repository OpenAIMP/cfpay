name: Deploy CFmail Agent

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    name: Type Check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: PROD
      url: https://pay.openaimp.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      - name: Set production Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PAYMENT_PRIVATE_KEY: ${{ secrets.PAYMENT_PRIVATE_KEY }}
          EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
        run: |
          printf '%s' "$PAYMENT_PRIVATE_KEY" | npx wrangler@4 secret put PAYMENT_PRIVATE_KEY
          printf '%s' "$EMAIL_SECRET" | npx wrangler@4 secret put EMAIL_SECRET
          printf '%s' "$DASHBOARD_API_KEY" | npx wrangler@4 secret put DASHBOARD_API_KEY
          printf '%s' "$SLACK_BOT_TOKEN" | npx wrangler@4 secret put SLACK_BOT_TOKEN
          printf '%s' "$SLACK_SIGNING_SECRET" | npx wrangler@4 secret put SLACK_SIGNING_SECRET
          printf '%s' "$SLACK_APP_TOKEN" | npx wrangler@4 secret put SLACK_APP_TOKEN
          printf '%s' "$SLACK_CLIENT_ID" | npx wrangler@4 secret put SLACK_CLIENT_ID

  deploy-preview:
    runs-on: ubuntu-latest
    name: Deploy Preview
    needs: typecheck
    if: github.event_name == 'pull_request'

    environment:
      name: preview

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy preview Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --name cfmail-agent-preview