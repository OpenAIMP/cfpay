name: Deploy CFmail Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    name: Type Check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsc --noEmit

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    needs: typecheck
    environment:
      name: PROD
      url: https://pay.openaimp.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
      - name: Set Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PAYMENT_PRIVATE_KEY: ${{ secrets.PAYMENT_PRIVATE_KEY }}
          EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
          DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
        run: |
          echo "$PAYMENT_PRIVATE_KEY" | npx wrangler secret put PAYMENT_PRIVATE_KEY
          echo "$EMAIL_SECRET" | npx wrangler secret put EMAIL_SECRET
          echo "$DASHBOARD_API_KEY" | npx wrangler secret put DASHBOARD_API_KEY

  deploy-preview:
    runs-on: ubuntu-latest
    name: Deploy Preview
    needs: typecheck
    if: github.event_name == 'pull_request'
    environment:
      name: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy src/index.ts --name cfmail-agent-preview