      #     gh api graphql -H 'GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection' -f query="mutation { replaceActorsForAssignable(input: { assignableId: \"$ISSUE_ID\", actorIds: [\"$BOT_ID\"], agentAssignment: { targetRepositoryId: \"$REPO_ID\", baseRef: \"main\", customInstructions: \"This is an automated post-deploy QA failure; the issue body is your brief. Triage first: if the cause is environmental (browser capacity, Workers AI neuron limits, provider transients) or needs the owner (a dashboard step, a secret, a policy decision), post that triage as an issue comment and make NO code changes. Otherwise make the minimal fix, run npx tsc --noEmit and npm test until both are green, and keep the pull request as a draft for human review - never merge. Never edit .github/workflows. Keep the change scoped to the failing area.\", customAgent: \"\", model: \"\" } }) { assignable { ... on Issue { id } } } }"
