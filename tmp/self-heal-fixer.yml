# Self-heal fixer — GitHub Actions edition, COPILOT-FREE (issue #195).
#
# Owner directive (2026-10-18): self-healing stays, Copilot is out for
# now. This is the original Copilot variant with every Copilot step
# COMMENTED OUT (not deleted), so the workflow remains the repo-side
# shell of the self-healing loop and Copilot can be switched back on
# by uncommenting the marked blocks.
#
# HOW IT WORKS NOW: this workflow does not assign or fix anything.
# When a [QA self-heal] issue is filed (and on a 6-hour sweep), the
# jobs below simply note the queue state. The actual fixing is done
# by the Muse fixer lane — the qa-self-heal-fixer cron (every
# 30 minutes) plus the qa-self-heal-watch hook (60-second poll) —
# which claims issues under branch-as-lock, opens fix PRs, and merges
# them when the checks are green. The post-deploy smoke files the
# issues and auto-closes them when a section passes again.
#
# TO RE-ENABLE COPILOT: uncomment the blocks marked "COPILOT (disabled
# 2026-10-18)" in both jobs and restore the name/env lines noted
# inline. The Copilot path also needs the Copilot coding agent
# available on the repo (the account's Copilot plan) and optionally a
# COPILOT_ASSIGN_TOKEN secret if GITHUB_TOKEN cannot assign.
#
# INSTALL: create .github/workflows/self-heal-fixer.yml with exactly
# this content (same file in both OpenAIMP/cfpay and OpenAIMP/cfagent).

name: Self-heal Fixer

on:
  issues:
    types: [opened]
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  assign-opened:
    name: Note the new self-heal issue (Muse fixer lane owns the queue)
    runs-on: ubuntu-24.04
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[QA self-heal]')
